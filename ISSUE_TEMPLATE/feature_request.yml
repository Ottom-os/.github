name: Feature Request
description: Propose new behavior. Bring the why.
title: "[FEAT] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Features without a problem statement get closed. Sell the problem, not the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this solve? Who feels it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: One paragraph. What should the system do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try? Why does it fall short?
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Cost of not doing this
      description: What happens if we never build it? Quantify if you can.
    validations:
      required: true
  - type: checkboxes
    id: searched
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
